# Render Blueprint: deploys GradApp's backend (Docker web service) and frontend (static site)
# on Render's free plan. The database is a free Neon Postgres (see DEPLOY.md).
services:
  - type: web
    name: gradapp-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # your frontend URL, e.g. https://gradapp-frontend.onrender.com
        sync: false
      - key: OPENAI_API_KEY        # optional: enables AI answers and web search
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: HTTPS
        value: "true"
      - key: SEED_SAMPLE_DATA      # loads the verified real starter data
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: AI_WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_CONCURRENCY       # the free instance has 512 MB of memory
        value: "1"

  - type: web
    name: gradapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite              # single-page app: serve index.html for every route
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL          # your backend URL + /api, e.g. https://gradapp-backend.onrender.com/api
        sync: false
