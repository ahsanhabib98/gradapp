services:
  database:
    image: postgres:17-alpine
    container_name: gradapp-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradapp}
      POSTGRES_USER: ${POSTGRES_USER:-gradapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradapp_dev_password}
    volumes:
      - gradapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gradapp} -d ${POSTGRES_DB:-gradapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gradapp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradapp-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      POSTGRES_DB: ${POSTGRES_DB:-gradapp}
      POSTGRES_USER: ${POSTGRES_USER:-gradapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradapp_dev_password}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    command: >
      sh -c "python manage.py seed_programs &&
             gunicorn gradapp.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gradapp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: gradapp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gradapp_network

volumes:
  gradapp_postgres_data:

networks:
  gradapp_network:
    driver: bridge
